name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# 赋予自动发布 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 补全配置文件与调试签名
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: 自动匹配并安装项目原生 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 编译 Debug APK
        run: gradle assembleDebug

      - name: 上传构建产物至 Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Harmonia-Studio-X-debug
          path: app/build/outputs/apk/debug/*.apk

      # 每次推送到 main 分支，自动覆盖更新主页右侧的 Releases
      - name: 自动发布/更新到 Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Harmonia Studio X 最新安装包 (持续构建)"
          body: "由 Google AI Studio 最新推送自动构建更新的安卓 APK。"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
