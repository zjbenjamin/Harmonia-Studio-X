name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 补全配置文件与永久固定调试签名
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 写入永久固定的签名密钥（确保每一次构建签名完全一致，永久支持直接覆盖更新）
          echo "" | base64 -d > debug.keystore
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: 自动匹配并安装项目原生 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 编译 Debug APK
        run: gradle assembleDebug

      - name: 准备版本号与更新描述
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/*.apk "./Harmonia-Studio-X-${VERSION}.apk"
          
          cat << 'EOF' > release_notes.md
          ### 📝 本次更新内容
          ${{ github.event.head_commit.message }}

          ---
          * 构建编号: #${{ github.run_number }}
          * 提交分支: ${{ github.ref_name }}
          EOF

      - name: 上传构建产物至 Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Harmonia-Studio-X-debug
          path: Harmonia-Studio-X-*.apk

      - name: 自动发布新版本到 Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Harmonia Studio X v1.0.${{ github.run_number }}"
          body_path: release_notes.md
          generate_release_notes: true
          files: Harmonia-Studio-X-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
